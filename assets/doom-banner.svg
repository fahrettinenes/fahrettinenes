<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="DOOM - Enter the gates">
  <defs>
    <!-- Hellish vertical gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0402"/>
      <stop offset="45%" stop-color="#3a0a05"/>
      <stop offset="100%" stop-color="#080302"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff6b1a" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#c1121f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd29a"/>
      <stop offset="35%" stop-color="#e0451a"/>
      <stop offset="75%" stop-color="#9e0d12"/>
      <stop offset="100%" stop-color="#4a0405"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="320" fill="url(#sky)"/>
  <rect width="1000" height="320" fill="url(#glow)">
    <animate attributeName="opacity" values="0.75;1;0.82;1;0.7" dur="4s" repeatCount="indefinite"/>
  </rect>

  <polygon points="0,250 90,200 170,240 260,190 360,235 470,185 560,230 670,188 780,238 880,198 1000,245 1000,320 0,320"
           fill="#120402" opacity="0.9"/>
  <polygon points="0,275 120,235 230,270 350,225 480,268 600,228 720,270 840,232 1000,272 1000,320 0,320"
           fill="#050201"/>

  <g fill="#ff7a1a">
    <circle cx="160" cy="260" r="2.5" opacity="0.9">
      <animate attributeName="cy" values="270;40" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="280" r="2" opacity="0.8">
      <animate attributeName="cy" values="285;60" dur="7.5s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="7.5s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="690" cy="265" r="3" opacity="0.85">
      <animate attributeName="cy" values="275;30" dur="5.5s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="5.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="285" r="2.2" opacity="0.8">
      <animate attributeName="cy" values="290;55" dur="8s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="8s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="270" r="1.8" opacity="0.7">
      <animate attributeName="cy" values="278;70" dur="6.8s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="6.8s" begin="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g font-family="Impact, 'Arial Black', sans-serif" text-anchor="middle">
    <text x="500" y="170" font-size="148" fill="#ff3b1a" filter="url(#blur)" letter-spacing="6">
      DOOM
      <animate attributeName="opacity" values="0.5;0.95;0.6;1;0.55" dur="2.6s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="170" font-size="148" fill="url(#metal)" stroke="#2a0202" stroke-width="2" letter-spacing="6">
      DOOM
      <animate attributeName="opacity" values="1;0.85;1;0.92;1" dur="0.18s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="500" y="210" font-family="'Courier New', monospace" font-size="20" letter-spacing="8"
        text-anchor="middle" fill="#d9cbb0" opacity="0.85">RIP AND TEAR</text>

  <g text-anchor="middle">
    <rect x="378" y="232" width="244" height="42" rx="3" fill="none" stroke="#ff6b1a" stroke-width="2">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="500" y="260" font-family="Impact, 'Arial Black', sans-serif" font-size="22"
          letter-spacing="4" fill="#ffd29a">&#9654; PRESS PLAY</text>
  </g>

  <rect x="0" y="0" width="1000" height="6" fill="#ffffff" opacity="0.06">
    <animate attributeName="y" values="-10;330" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <g fill="#000000" opacity="0.16">
    <rect x="0" y="0"   width="1000" height="2"/>
    <rect x="0" y="6"   width="1000" height="2"/>
    <rect x="0" y="12"  width="1000" height="2"/>
    <rect x="0" y="18"  width="1000" height="2"/>
    <rect x="0" y="24"  width="1000" height="2"/>
  </g>
  <rect width="1000" height="320" fill="none" stroke="#000" stroke-width="10" opacity="0.5"/>
</svg>
